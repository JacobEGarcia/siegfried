<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SIEGFRIED - after Die Nibelungen (1924)</title>
<meta name="description" content="A silent game in three acts, after Fritz Lang's Die Nibelungen: Siegfried (1924). Forge the sword. Slay the dragon. Guard your back.">
<style>
html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;}
canvas{display:block;width:100vw;height:100vh;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var W=1280,H=720;
var INK='#e9e5da', DIM='#7d7a70', FAINT='#2e2d29', BG='#050505', BLOOD='#8a1c1c';
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var dpr=1,scale=1,ox=0,oy=0,cw=1280,ch=720;
var timeNow=0,shakeT=0;
function resize(){
  cw=window.innerWidth||1280; ch=window.innerHeight||720;
  dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(cw*dpr); canvas.height=Math.round(ch*dpr);
  scale=Math.min(cw/W,ch/H); ox=(cw-W*scale)/2; oy=(ch-H*scale)/2;
}
if(window.addEventListener)window.addEventListener('resize',resize);
resize();

function drawText(str,x,y,size,color,spacing,align){
  ctx.font=size+'px Georgia,"Times New Roman",serif';
  ctx.fillStyle=color||INK; ctx.textBaseline='middle'; ctx.textAlign='center';
  spacing=spacing||0; align=align||'center';
  var i,w,total=0,widths=[];
  for(i=0;i<str.length;i++){w=ctx.measureText(str.charAt(i)).width;widths.push(w);total+=w;}
  total+=spacing*Math.max(0,str.length-1);
  var sx=align==='center'?x-total/2:(align==='right'?x-total:x);
  for(i=0;i<str.length;i++){ctx.fillText(str.charAt(i),sx+widths[i]/2,y);sx+=widths[i]+spacing;}
}
function cardFrame(a){
  ctx.strokeStyle='rgba(233,229,218,'+a+')'; ctx.lineWidth=1;
  ctx.strokeRect(70,70,W-140,H-140);
  ctx.strokeRect(80,80,W-160,H-160);
}
function blinkOn(){return (timeNow%1.2)<0.75;}

// audio
var AC=null,muted=false;
function unlockAudio(){
  if(!AC){var A=window.AudioContext||window.webkitAudioContext; if(A){try{AC=new A();}catch(e){AC=null;}}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
}
function beep(f0,f1,dur,type,vol){
  if(!AC||muted)return;
  try{
    var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'square';
    o.frequency.setValueAtTime(Math.max(20,f0),t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(vol||0.07,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function clang(){beep(230,55,0.16,'square',0.09);beep(1200,300,0.05,'square',0.03);}

// state
var state='title';
var card=null;
var forge=null,dragon=null,hero=null,hunt=null;
var dragSparks=[];
var dragonMaxHP=8;
var best=0;
try{best=parseFloat(localStorage.getItem('siegfried_best'))||0;}catch(e){}
function saveBest(v){best=v;try{localStorage.setItem('siegfried_best',String(v));}catch(e){}}

function showCard(lines,next,minT){
  state='card';
  card={lines:lines,next:next,t:0,minT:(minT==null?1.2:minT)};
}
function advanceCard(){ if(card&&card.t>=card.minT){var n=card.next;card=null;n();} }

// input
var mouse={x:W/2,y:H/2,down:false};
var keysDown={};
function primaryKey(code){
  unlockAudio();
  if(code==='KeyM'){muted=!muted;return;}
  if(state==='title'){toAct1Card();return;}
  if(state==='card'){advanceCard();return;}
  if(state==='forge'&&(code==='Space'||code==='Enter')){forgeStrike();return;}
  if(state==='dragon'&&(code==='Space'||code==='Enter')){heroSwing();return;}
}
function tap(){
  unlockAudio();
  if(state==='title'){toAct1Card();return;}
  if(state==='card'){advanceCard();return;}
  if(state==='forge'){forgeStrike();return;}
  if(state==='dragon'){heroSwing();return;}
}
function setMouse(cx,cy){mouse.x=(cx-ox)/scale;mouse.y=(cy-oy)/scale;}
if(window.addEventListener){
  window.addEventListener('keydown',function(e){if(e.repeat)return;keysDown[e.code]=true;primaryKey(e.code);if(e.code==='Space'&&e.preventDefault)e.preventDefault();});
  window.addEventListener('keyup',function(e){keysDown[e.code]=false;});
}
if(canvas.addEventListener){
  canvas.addEventListener('mousedown',function(e){mouse.down=true;setMouse(e.clientX,e.clientY);tap();});
  canvas.addEventListener('mousemove',function(e){setMouse(e.clientX,e.clientY);});
  window.addEventListener('mouseup',function(){mouse.down=false;});
  canvas.addEventListener('touchstart',function(e){if(e.preventDefault)e.preventDefault();var t=e.touches[0];mouse.down=true;setMouse(t.clientX,t.clientY);tap();},{passive:false});
  canvas.addEventListener('touchmove',function(e){if(e.preventDefault)e.preventDefault();var t=e.touches[0];setMouse(t.clientX,t.clientY);},{passive:false});
  canvas.addEventListener('touchend',function(e){if(e.preventDefault)e.preventDefault();mouse.down=false;},{passive:false});
}

// particles
function addSparks(arr,x,y,n,spread){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, s=(spread||160)*(0.4+Math.random());
    arr.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:0.5+Math.random()*0.3});
  }
}
function updateSparks(arr,dt){
  for(var i=arr.length-1;i>=0;i--){var p=arr[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;if(p.life<=0)arr.splice(i,1);}
}
function drawSparks(arr){
  ctx.strokeStyle=INK;ctx.lineWidth=2;
  for(var i=0;i<arr.length;i++){var p=arr[i];ctx.globalAlpha=Math.max(0,p.life*1.6);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*0.03,p.y-p.vy*0.03);ctx.stroke();}
  ctx.globalAlpha=1;
}

// figure: local +x = facing, feet at origin, body extends -y
function drawFigure(x,y,angle,opts){
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  ctx.fillStyle=(opts&&opts.color)||INK;
  ctx.fillRect(-14,-34,10,34);
  ctx.fillRect(4,-34,10,34);
  ctx.fillRect(-16,-64,32,32);
  ctx.fillRect(-9,-80,18,16);
  var sw=(opts&&opts.swing)||0;
  ctx.save();ctx.translate(10,-54);
  ctx.rotate(-0.4-sw*1.8);
  ctx.fillRect(0,-2,48,4);
  ctx.fillRect(6,-7,5,14);
  ctx.restore();
  ctx.restore();
}

// TITLE
function toAct1Card(){
  showCard([
    {t:'ACT I',size:30,color:DIM},
    {t:'THE FORGE',size:64},
    {t:'SIEGFRIED, SON OF SIEGMUND, FORGES A SWORD NO ANVIL CAN HOLD.',size:16,color:DIM}
  ],startForge,1.4);
}
function drawTitle(){
  cardFrame(0.35);
  drawText('SIEGFRIED',W/2,240,96,INK,16);
  drawText('A SILENT GAME IN THREE ACTS',W/2,316,20,DIM,6);
  drawText("AFTER FRITZ LANG'S DIE NIBELUNGEN (1924)",W/2,352,15,DIM,4);
  ctx.strokeStyle=INK;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(W/2,404);ctx.lineTo(W/2,484);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2-28,416);ctx.lineTo(W/2+28,416);ctx.stroke();
  ctx.fillStyle=INK;ctx.fillRect(W/2-4,486,8,8);
  if(blinkOn())drawText('TAP OR PRESS ANY KEY TO BEGIN',W/2,560,16,INK,4);
  if(best>0)drawText('LONGEST HUNT  '+best.toFixed(1)+' SECONDS',W/2,612,13,DIM,3);
  drawText('M - SOUND '+(muted?'OFF':'ON'),W-100,H-40,11,DIM,2);
}

// CARD
function drawCard(){
  cardFrame(0.5);
  var totalH=0,i,l;
  for(i=0;i<card.lines.length;i++){totalH+=card.lines[i].size*1.5;}
  var y=H/2-totalH/2;
  for(i=0;i<card.lines.length;i++){
    l=card.lines[i]; y+=l.size*0.75;
    drawText(l.t,W/2,y,l.size,l.color||INK,l.size>=40?8:3);
    y+=l.size*0.75;
  }
  if(card.t>=card.minT&&blinkOn())drawText('TAP TO CONTINUE',W/2,H-130,13,DIM,4);
}

// ACT I - FORGE
function startForge(){
  state='forge';
  forge={strikes:0,need:12,flaws:0,pos:0.15,dir:1,hammerT:0,done:-1,sparks:[],msg:'',msgT:0};
}
function forgeHot(){return Math.max(0.08,0.22-forge.strikes*0.011);}
function forgeStrike(){
  if(!forge||forge.done>=0)return;
  if(forge.hammerT>0.14)return;
  forge.hammerT=0.32;
  var hot=forgeHot(),d=Math.abs(forge.pos-0.5);
  if(d<hot/2){forge.strikes+=1;forge.msg='A CLEAN STRIKE';clang();addSparks(forge.sparks,640,468,20,220);}
  else if(d<hot*0.95){forge.strikes+=0.5;forge.msg='GLANCING';beep(600,240,0.09,'square',0.05);addSparks(forge.sparks,640,468,8,140);}
  else{forge.flaws++;forge.msg='A FLAW ENTERS THE BLADE';beep(130,45,0.3,'sawtooth',0.1);shakeT=0.3;}
  forge.msgT=1.2;
  if(forge.strikes>=forge.need){forge.done=1.0;clang();}
}
function updateForge(dt){
  if(forge.done<0){
    var sp=0.85+forge.strikes*0.07;
    forge.pos+=forge.dir*sp*dt;
    if(forge.pos>1){forge.pos=1;forge.dir=-1;}
    if(forge.pos<0){forge.pos=0;forge.dir=1;}
  }
  if(forge.hammerT>0)forge.hammerT-=dt;
  if(forge.msgT>0)forge.msgT-=dt;
  updateSparks(forge.sparks,dt);
  if(forge.done>=0){
    forge.done-=dt;
    if(forge.done<=0){
      var flawed=forge.flaws>=4;
      dragonMaxHP=flawed?12:8;
      showCard([
        {t:'BALMUNG',size:64},
        {t:flawed?'FOUR FLAWS RUN THROUGH IT. IT WILL SERVE, BARELY.':'A SWORD TO SPLIT THE ANVIL ITSELF.',size:16,color:DIM},
        {t:'ACT II',size:28,color:DIM},
        {t:'FAFNIR',size:56},
        {t:'A DRAGON GUARDS THE HOARD OF THE NIBELUNGS.',size:16,color:DIM}
      ],startDragon,1.6);
    }
  }
}
function drawForge(){
  var g=ctx.createRadialGradient(640,470,10,640,470,360);
  g.addColorStop(0,'rgba(233,229,218,'+(0.10+0.16*(forge.strikes/forge.need)).toFixed(3)+')');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=INK;
  ctx.beginPath();
  ctx.moveTo(560,470);ctx.lineTo(720,470);ctx.lineTo(700,490);ctx.lineTo(700,540);
  ctx.lineTo(730,560);ctx.lineTo(550,560);ctx.lineTo(580,540);ctx.lineTo(580,490);
  ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(560,470);ctx.lineTo(500,478);ctx.lineTo(560,486);ctx.closePath();ctx.fill();
  var heat=0.25+0.75*(forge.strikes/forge.need);
  ctx.fillStyle='rgba(233,229,218,'+heat.toFixed(3)+')';
  ctx.fillRect(596,458,88,12);
  var swing=forge.hammerT>0?Math.sin((0.32-forge.hammerT)/0.32*Math.PI)*1.1:0;
  ctx.save();ctx.translate(640,470);ctx.rotate(-0.5-swing*0.5);
  ctx.fillStyle=INK;
  ctx.fillRect(-6,-260,12,220);
  ctx.fillRect(-40,-280,80,44);
  ctx.restore();
  drawSparks(forge.sparks);
  var bx0=340,bx1=940,by=648,hot=forgeHot();
  ctx.strokeStyle=DIM;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(bx0,by);ctx.lineTo(bx1,by);ctx.stroke();
  var hx0=bx0+(bx1-bx0)*(0.5-hot/2),hx1=bx0+(bx1-bx0)*(0.5+hot/2);
  ctx.fillStyle='rgba(233,229,218,0.18)';ctx.fillRect(hx0,by-8,hx1-hx0,16);
  ctx.strokeStyle=INK;ctx.strokeRect(hx0,by-8,hx1-hx0,16);
  var mx=bx0+(bx1-bx0)*forge.pos;
  ctx.strokeStyle=INK;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(mx,by-16);ctx.lineTo(mx,by+16);ctx.stroke();
  drawText('BLOWS '+Math.floor(forge.strikes)+' / '+forge.need,110,40,16,DIM,3,'left');
  if(forge.flaws>0)drawText('FLAWS '+forge.flaws,110,66,13,forge.flaws>=3?BLOOD:DIM,3,'left');
  if(forge.msgT>0)drawText(forge.msg,W/2,120,18,INK,4);
  drawText('SPACE / TAP - STRIKE WHEN THE MARK CROSSES THE HEAT',W/2,H-40,13,DIM,3);
}

// ACT II - FAFNIR
function startDragon(){
  state='dragon';
  dragon={hp:dragonMaxHP,maxhp:dragonMaxHP,phase:'idle',t:0,headY:280,headX:1010,fireOn:false,fireTargetX:400,breaths:0,bloodT:0,eyeGlow:0,dead:false};
  hero={x:220,hearts:3,inv:0,swingT:0};
  dragSparks=[];
}
function setPhase(p){dragon.phase=p;dragon.t=0;}
function mouthPos(){return {x:dragon.headX-118,y:dragon.headY+8};}
function heroSwing(){
  if(!hero||!dragon)return;
  if(hero.swingT>0.1)return;
  hero.swingT=0.28;
  beep(300,900,0.07,'square',0.03);
  if(dragon.phase==='low'&&!dragon.dead){
    var hx=dragon.headX-70;
    if(Math.abs(hero.x-hx)<290){
      dragon.hp--;
      addSparks(dragSparks,hx,dragon.headY,24,240);
      clang();shakeT=0.35;
      if(dragon.hp<=0){dragon.dead=true;setPhase('dying');beep(80,30,1.0,'sawtooth',0.12);}
    }
  }
}
function fireHitsHero(){
  var m=mouthPos();
  var tx=dragon.fireTargetX,ty=545;
  var hx=hero.x,hy=520;
  for(var i=1;i<=16;i++){
    var f=i/16;
    var px=m.x+(tx-m.x)*f;
    var py=m.y+(ty-m.y)*f+Math.sin(timeNow*24+i*1.7)*12*f;
    var dx=px-hx,dy=py-hy;
    if(dx*dx+dy*dy<900)return true;
  }
  return false;
}
function updateDragon(dt){
  if(hero.inv>0)hero.inv-=dt;
  if(hero.swingT>0)hero.swingT-=dt;
  var mv=0;
  if(keysDown['ArrowLeft']||keysDown['KeyA'])mv-=1;
  if(keysDown['ArrowRight']||keysDown['KeyD'])mv+=1;
  if(mv!==0)hero.x+=mv*430*dt;
  if(mouse.down){hero.x+=(mouse.x-hero.x)*Math.min(1,dt*10);}
  hero.x=Math.max(70,Math.min(1150,hero.x));
  dragon.t+=dt;
  var D=dragon;
  if(D.phase==='idle'){
    D.headY=280+Math.sin(timeNow*1.4)*26;
    if(D.t>2.0)setPhase('telegraph');
  }else if(D.phase==='telegraph'){
    D.headY+=(220-D.headY)*Math.min(1,dt*6);
    D.eyeGlow=Math.min(1,D.eyeGlow+dt*3);
    if(D.t>0.7){D.fireTargetX=hero.x;setPhase('breath');beep(60,180,0.5,'sawtooth',0.06);}
  }else if(D.phase==='breath'){
    D.eyeGlow=Math.max(0,D.eyeGlow-dt*4);
    D.fireOn=true;
    if(hero.inv<=0&&fireHitsHero()){
      hero.hearts--;hero.inv=1.4;shakeT=0.5;beep(90,40,0.4,'sawtooth',0.12);
      if(hero.hearts<=0){
        showCard([
          {t:'THE FIRE TOOK HIM',size:52},
          {t:'THE FORGE REMEMBERS. RISE AGAIN.',size:16,color:DIM}
        ],startDragon,1.4);
        return;
      }
    }
    if(D.t>1.5){
      D.fireOn=false;D.breaths++;
      if(D.breaths%3===0)setPhase('telegraph');
      else setPhase('low');
    }
  }else if(D.phase==='low'){
    D.headY+=(486-D.headY)*Math.min(1,dt*5);
    if(D.t>2.3)setPhase('idle');
  }else if(D.phase==='dying'){
    D.fireOn=false;
    D.headY+=(520-D.headY)*Math.min(1,dt*2);
    D.bloodT=Math.min(1,D.bloodT+dt*0.5);
    if(D.t>2.4){
      showCard([
        {t:'THE BLOOD',size:60},
        {t:'FAFNIR IS SLAIN. SIEGFRIED BATHED IN ITS BLOOD,',size:16,color:DIM},
        {t:'AND HIS SKIN TURNED TO HORN.',size:16,color:DIM}
      ],act3Card,1.6);
      return;
    }
  }
  updateSparks(dragSparks,dt);
}
function act3Card(){
  showCard([
    {t:'ACT III',size:28,color:DIM},
    {t:'THE HUNT',size:56},
    {t:'ONE LINDEN LEAF FELL BETWEEN HIS SHOULDERS AS HE BATHED.',size:15,color:DIM},
    {t:'KRIEMHILD SEWED A CROSS OVER THE SPOT, THAT HAGEN MIGHT GUARD IT.',size:15,color:DIM},
    {t:'HAGEN TOOK NOTE.',size:18}
  ],startHunt,2.0);
}
function drawDragon(){
  ctx.strokeStyle=FAINT;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,560);ctx.lineTo(W,560);ctx.stroke();
  var D=dragon;
  ctx.fillStyle=INK;
  ctx.beginPath();
  ctx.moveTo(W,560);ctx.lineTo(W,300);ctx.lineTo(1180,340);ctx.lineTo(1140,420);ctx.lineTo(1160,560);
  ctx.closePath();ctx.fill();
  var i;
  for(i=0;i<5;i++){
    var sx=1150+i*24;
    ctx.beginPath();ctx.moveTo(sx,340-i*10);ctx.lineTo(sx+10,290-i*14);ctx.lineTo(sx+22,344-i*10);ctx.closePath();ctx.fill();
  }
  var m=mouthPos();
  var hx=D.headX,hy=D.headY;
  for(var j=1;j<=4;j++){
    var f=j/4;
    var cx=1150+(hx+40-1150)*f, cy=430+(hy-430)*f;
    var s=34-4*j;
    ctx.beginPath();
    ctx.moveTo(cx-14,cy+s*0.5);ctx.lineTo(cx,cy-s*0.6);ctx.lineTo(cx+16,cy+s*0.5);
    ctx.closePath();ctx.fill();
  }
  ctx.beginPath();
  ctx.moveTo(hx+30,hy-44);ctx.lineTo(hx-96,hy-30);ctx.lineTo(hx-118,hy+2);
  ctx.lineTo(hx-40,hy+18);ctx.lineTo(hx+24,hy+30);
  ctx.closePath();ctx.fill();
  var jaw=D.fireOn?26:(D.phase==='telegraph'?14:6);
  ctx.beginPath();
  ctx.moveTo(hx-40,hy+18);ctx.lineTo(hx-110,hy+18+jaw);ctx.lineTo(hx-30,hy+34+jaw*0.5);ctx.lineTo(hx+24,hy+30);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=BG;
  for(var k=0;k<3;k++){
    ctx.beginPath();
    ctx.moveTo(hx-100+k*22,hy-26);ctx.lineTo(hx-92+k*22,hy-8);ctx.lineTo(hx-84+k*22,hy-26);
    ctx.closePath();ctx.fill();
  }
  ctx.beginPath();ctx.moveTo(hx-34,hy-30);ctx.lineTo(hx-6,hy-26);ctx.lineTo(hx-30,hy-14);ctx.closePath();ctx.fill();
  if(D.eyeGlow>0){
    ctx.fillStyle='rgba(233,229,218,'+(0.5*D.eyeGlow).toFixed(3)+')';
    ctx.beginPath();ctx.arc(hx-22,hy-23,10+D.eyeGlow*8,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle=INK;
  ctx.beginPath();ctx.moveTo(hx+10,hy-42);ctx.lineTo(hx+2,hy-86);ctx.lineTo(hx+28,hy-46);ctx.closePath();ctx.fill();
  if(D.fireOn){
    var tx=D.fireTargetX,ty=545;
    for(var i2=1;i2<=16;i2++){
      var f2=i2/16;
      var px=m.x+(tx-m.x)*f2;
      var py=m.y+(ty-m.y)*f2+Math.sin(timeNow*24+i2*1.7)*12*f2;
      var sz=8+f2*26+Math.sin(timeNow*40+i2)*4;
      ctx.fillStyle=i2<6?INK:(i2<11?'#b9b4a6':'#6f6a5e');
      ctx.beginPath();
      ctx.moveTo(px,py-sz);ctx.lineTo(px-sz*0.7,py+sz*0.5);ctx.lineTo(px+sz*0.7,py+sz*0.5);
      ctx.closePath();ctx.fill();
    }
  }
  if(D.bloodT>0){
    ctx.fillStyle='rgba(138,28,28,'+(0.85*D.bloodT).toFixed(3)+')';
    var bw=60+D.bloodT*520;
    ctx.fillRect(1150-bw/2,556,bw,10);
    var bw2=D.bloodT*300;
    ctx.fillRect(1150-bw2/2,566,bw2,6);
  }
  if(hero.inv<=0||Math.floor(timeNow*12)%2===0){
    drawFigure(hero.x,560,0,{swing:hero.swingT>0?(0.28-hero.swingT)/0.28:0});
  }
  drawSparks(dragSparks);
  for(var h=0;h<hero.hearts;h++){ctx.fillStyle=INK;ctx.save();ctx.translate(50+h*26,44);ctx.rotate(Math.PI/4);ctx.fillRect(-6,-6,12,12);ctx.restore();}
  for(var h2=0;h2<D.maxhp;h2++){ctx.fillStyle=h2<D.hp?INK:FAINT;ctx.fillRect(W-60-h2*18,36,12,12);}
  if(D.phase==='low'&&!D.dead&&blinkOn())drawText('STRIKE NOW',W/2,110,22,INK,6);
  drawText('A / D OR DRAG - MOVE      SPACE / TAP - STRIKE',W/2,H-40,13,DIM,3);
}

// ACT III - THE HUNT
function makeTrees(){
  var arr=[];
  for(var i=0;i<26;i++){arr.push({x:Math.random()*W,h:60+Math.random()*150,w:14+Math.random()*20,row:Math.random()});}
  return arr;
}
function startHunt(){
  state='hunt';
  hunt={t:0,spawnT:1.0,spears:[],sparks:[],trees:makeTrees(),dead:false,dieT:0,killer:null,faceLock:0,msgT:6,facing:-Math.PI/2};
}
function huntFeet(){return {x:W/2,y:486};}
function huntCore(){return {x:W/2,y:486-48};}
function spawnSpear(){
  var c=huntCore();
  var a=Math.random()*Math.PI*2;
  var sx=c.x+Math.cos(a)*900, sy=c.y+Math.sin(a)*560;
  var ja=(Math.random()-0.5)*0.10;
  var va=Math.atan2(c.y-sy,c.x-sx)+ja;
  var sp=Math.min(580,250+hunt.t*4.5);
  hunt.spears.push({x:sx,y:sy,vx:Math.cos(va)*sp,vy:Math.sin(va)*sp});
  if(hunt.t>25&&Math.random()<0.25){
    var a2=Math.random()*Math.PI*2;
    var s2x=c.x+Math.cos(a2)*900, s2y=c.y+Math.sin(a2)*560;
    var v2a=Math.atan2(c.y-s2y,c.x-s2x);
    hunt.spears.push({x:s2x,y:s2y,vx:Math.cos(v2a)*sp,vy:Math.sin(v2a)*sp});
  }
}
function updateHunt(dt){
  var Hu=hunt;
  if(Hu.dead){
    Hu.dieT+=dt;
    if(Hu.dieT>2.0){
      var t=Hu.t,isBest=t>best;
      if(isBest)saveBest(t);
      showCard([
        {t:'SIEGFRIED FALLS',size:60},
        {t:'AT THE SPRING, THE SPEAR FOUND THE CROSS.',size:16,color:DIM},
        {t:'YOU LASTED '+t.toFixed(1)+' SECONDS',size:22},
        {t:isBest?'A NEW LONGEST HUNT.':'THE LONGEST HUNT: '+best.toFixed(1)+' SECONDS',size:15,color:DIM}
      ],function(){state='title';},1.6);
    }
    return;
  }
  Hu.t+=dt;
  if(Hu.msgT>0)Hu.msgT-=dt;
  var rot=0;
  if(keysDown['ArrowLeft']||keysDown['KeyA'])rot-=1;
  if(keysDown['ArrowRight']||keysDown['KeyD'])rot+=1;
  if(rot!==0){Hu.facing+=rot*3.2*dt;Hu.faceLock=timeNow+1.2;}
  var c=huntCore();
  if(timeNow>Hu.faceLock){
    var dx=mouse.x-c.x,dy=mouse.y-c.y;
    if(dx*dx+dy*dy>100)Hu.facing=Math.atan2(dy,dx);
  }
  Hu.spawnT-=dt;
  if(Hu.spawnT<=0){spawnSpear();Hu.spawnT=Math.max(0.55,1.5-Hu.t*0.018);}
  for(var i=Hu.spears.length-1;i>=0;i--){
    var s=Hu.spears[i];
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    var ddx=s.x-c.x,ddy=s.y-c.y;
    if(ddx*ddx+ddy*ddy<1024){
      var vl=Math.sqrt(s.vx*s.vx+s.vy*s.vy)||1;
      var ux=s.vx/vl,uy=s.vy/vl;
      var dot=ux*Math.cos(Hu.facing)+uy*Math.sin(Hu.facing);
      if(dot>0.45){
        Hu.dead=true;Hu.killer=s;
        Hu.spears.splice(i,1);
        beep(90,28,1.1,'sawtooth',0.13);
        shakeT=0.8;
      }else{
        addSparks(Hu.sparks,c.x-ddx*0.5,c.y-ddy*0.5,10,180);
        beep(950,1500,0.05,'square',0.045);
        Hu.spears.splice(i,1);
      }
      continue;
    }
    if(s.x<-100||s.x>W+100||s.y<-100||s.y>H+100)Hu.spears.splice(i,1);
  }
  updateSparks(Hu.sparks,dt);
}
function drawHunt(){
  var Hu=hunt,p=huntFeet();
  ctx.strokeStyle=FAINT;ctx.lineWidth=1;
  for(var i=0;i<Hu.trees.length;i++){
    var tr=Hu.trees[i];
    var baseY=tr.row<0.5?H-60:H-16;
    ctx.beginPath();
    ctx.moveTo(tr.x,baseY-tr.h);ctx.lineTo(tr.x-tr.w,baseY);ctx.lineTo(tr.x+tr.w,baseY);
    ctx.closePath();ctx.stroke();
  }
  ctx.beginPath();ctx.moveTo(0,H-60);ctx.lineTo(W,H-60);ctx.stroke();
  var j,s,vl,ux,uy;
  ctx.lineWidth=2;
  for(j=0;j<Hu.spears.length;j++){
    s=Hu.spears[j];
    vl=Math.sqrt(s.vx*s.vx+s.vy*s.vy)||1;ux=s.vx/vl;uy=s.vy/vl;
    ctx.strokeStyle=INK;
    ctx.beginPath();ctx.moveTo(s.x-ux*60,s.y-uy*60);ctx.lineTo(s.x,s.y);ctx.stroke();
    ctx.fillStyle=INK;
    ctx.beginPath();
    ctx.moveTo(s.x+ux*10,s.y+uy*10);ctx.lineTo(s.x-uy*5,s.y+ux*5);ctx.lineTo(s.x+uy*5,s.y-ux*5);
    ctx.closePath();ctx.fill();
  }
  var c=huntCore();
  var ang=0;
  if(Hu.dead)ang=Math.min(1,Hu.dieT*1.5)*(Math.PI/2)*0.9;
  drawFigure(p.x,p.y,ang,{swing:0});
  var fvx=Math.cos(Hu.facing),fvy=Math.sin(Hu.facing);
  ctx.strokeStyle=INK;ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(c.x+fvx*26,c.y+fvy*26);ctx.lineTo(c.x+fvx*62,c.y+fvy*62);ctx.stroke();
  ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(c.x+fvx*40-fvy*7,c.y+fvy*40+fvx*7);ctx.lineTo(c.x+fvx*40+fvy*7,c.y+fvy*40-fvx*7);ctx.stroke();
  var bx=c.x-fvx*30, by=c.y-fvy*30;
  ctx.strokeStyle=BLOOD;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(bx-8,by);ctx.lineTo(bx+8,by);ctx.stroke();
  ctx.beginPath();ctx.moveTo(bx,by-8);ctx.lineTo(bx,by+8);ctx.stroke();
  if(Hu.dead&&Hu.killer){
    s=Hu.killer;vl=Math.sqrt(s.vx*s.vx+s.vy*s.vy)||1;ux=s.vx/vl;uy=s.vy/vl;
    ctx.strokeStyle=INK;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(bx-ux*70,by-uy*70);ctx.lineTo(bx+ux*6,by+uy*6);ctx.stroke();
  }
  drawSparks(Hu.sparks);
  drawText(Hu.t.toFixed(1),W/2,46,26,INK,4);
  if(best>0)drawText('BEST '+best.toFixed(1),W-90,42,13,DIM,3,'right');
  if(Hu.msgT>0)drawText('FACE EACH SPEAR. YOUR BACK BEARS THE CROSS.',W/2,H-70,15,INK,3);
  drawText('MOUSE / DRAG OR A / D - TURN',W/2,H-40,13,DIM,3);
}

// main
function update(dt){
  timeNow+=dt;
  if(shakeT>0)shakeT-=dt;
  if(state==='card'&&card)card.t+=dt;
  else if(state==='forge')updateForge(dt);
  else if(state==='dragon')updateDragon(dt);
  else if(state==='hunt')updateHunt(dt);
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#000';ctx.fillRect(0,0,cw,ch);
  var shx=0,shy=0;
  if(shakeT>0){shx=(Math.random()-0.5)*shakeT*24;shy=(Math.random()-0.5)*shakeT*24;}
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*(ox+shx),dpr*(oy+shy));
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  if(state==='title')drawTitle();
  else if(state==='card')drawCard();
  else if(state==='forge')drawForge();
  else if(state==='dragon')drawDragon();
  else if(state==='hunt')drawHunt();
}
var last=-1;
function frame(ts){
  if(last<0)last=ts;
  var dt=(ts-last)/1000;last=ts;
  if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  update(dt);draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__SIEGE__={
  update:update,draw:draw,primaryKey:primaryKey,tap:tap,
  getState:function(){return state;},
  getForge:function(){return forge;},
  getDragon:function(){return dragon;},
  getHero:function(){return hero;},
  getHunt:function(){return hunt;},
  getCard:function(){return card;},
  setMouse:function(x,y){mouse.x=x;mouse.y=y;},
  setKey:function(c,v){keysDown[c]=v;},
  startHunt:startHunt,startForge:startForge,startDragon:startDragon
};
})();
</script>
